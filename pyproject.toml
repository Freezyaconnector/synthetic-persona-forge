[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "synthetic-persona-forge"
version = "0.6.2"
description = "Layered Windows desktop tool for generating and managing synthetic AI influencer personas."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "synthetic-persona-forge contributors" }]
keywords = ["ai-influencer", "synthetic-persona", "voice-clone", "face-lora", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]

dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<0.13",
  "rich>=13.7,<14",
  "httpx>=0.27,<0.28",
  "tomli-w>=1.0,<2",
  "keyring>=25.2,<26",
  "Pillow>=10.3,<11",
  "numpy>=1.26,<2",
  "onnxruntime>=1.18,<2 ; platform_system == 'Windows'",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
voice = ["soundfile>=0.12,<0.13", "librosa>=0.10,<0.11"]
face = ["torch>=2.3,<3 ; platform_system == 'Windows'", "diffusers>=0.29,<0.30"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.4", "black>=24.4", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
persona-forge = "persona_forge.bootstrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_forge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=persona_forge --cov-report=term-missing"

[tool.mypy]
strict = true
files = ["src/persona_forge/core", "src/persona_forge/models"]